<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Fair Trade Safaris</title>
    <meta name="theme-color" content="#2F3E46" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          "Apple Color Emoji",
          "Segoe UI Emoji";
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #fafafa;
      }
      .card {
        width: min(92vw, 480px);
        border-radius: 16px;
        border: 1px solid #2a2a2a;
        padding: 24px;
        background: #181818;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid #2a2a2a;
        margin: 8px auto 16px;
        background: #f2e6d3;
        color: #111;
        font-weight: 700;
        font-size: 12px;
      }
      h1 {
        font-size: 20px;
        margin: 8px 0 6px;
      }
      p {
        opacity: 0.8;
        margin: 0 0 16px;
      }
      .row {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      button,
      a {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        text-decoration: none;
      }
      .primary {
        background: #fff;
        color: #111;
      }
      .ghost {
        background: transparent;
        color: #fff;
        border: 1px solid #2a2a2a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">FTS</div>
      <h1>You’re offline</h1>
      <p>
        Pages you’ve already opened may still work. When you’re back online,
        reload to continue exploring Fair Trade Safaris.
      </p>
      <div class="row">
        <button class="ghost" onclick="location.reload()">Retry</button>
        <a class="primary" href="/">Go Home</a>
      </div>
    </main>
  </body>
</html>
